name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0.9'
          bundler-cache: true
      - run: bin/ci
        env:
          CI: 'true'
